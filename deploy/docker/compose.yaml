services:
  sketchforge:
    image: sketchforge:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${SKETCHFORGE_PORT:-3000}:3000"
    environment:
      SKETCHFORGE_SHARED_PROJECTS_DIR: /data/projects
      EDUCAD_CHALLENGES_DIR: /data/challenges
    volumes:
      - "${SKETCHFORGE_SHARED_PROJECTS_VOLUME:-sketchforge-shared-projects}:/data/projects"
      - "${EDUCAD_CHALLENGES_VOLUME:-educad-challenges}:/data/challenges:ro"
    restart: unless-stopped

volumes:
  sketchforge-shared-projects:
  educad-challenges:
