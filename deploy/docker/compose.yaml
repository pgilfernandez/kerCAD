services:
  kercad:
    image: kercad:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        KERCAD_COMMIT: "${KERCAD_COMMIT:-}"
    ports:
      - "${KERCAD_PORT:-${SKETCHFORGE_PORT:-3000}}:3000"
    environment:
      KERCAD_SHARED_PROJECTS_DIR: /data/projects
      KERCAD_CHALLENGES_DIR: /data/challenges
    volumes:
      - "sketchforge-shared-projects:/data/projects"
      - "${KERCAD_CHALLENGES_VOLUME:-kercad-challenges}:/data/challenges:ro"
    restart: unless-stopped

volumes:
  sketchforge-shared-projects:
    name: "${KERCAD_SHARED_PROJECTS_VOLUME:-${SKETCHFORGE_SHARED_PROJECTS_VOLUME:-${COMPOSE_PROJECT_NAME:-docker}_sketchforge-shared-projects}}"
  kercad-challenges:
