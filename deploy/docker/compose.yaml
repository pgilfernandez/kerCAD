services:
  educad:
    image: educad:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        EDUCAD_COMMIT: "${EDUCAD_COMMIT:-}"
    ports:
      - "${EDUCAD_PORT:-${SKETCHFORGE_PORT:-3000}}:3000"
    environment:
      EDUCAD_SHARED_PROJECTS_DIR: /data/projects
      EDUCAD_CHALLENGES_DIR: /data/challenges
    volumes:
      - "sketchforge-shared-projects:/data/projects"
      - "${EDUCAD_CHALLENGES_VOLUME:-educad-challenges}:/data/challenges:ro"
    restart: unless-stopped

volumes:
  sketchforge-shared-projects:
    name: "${EDUCAD_SHARED_PROJECTS_VOLUME:-${SKETCHFORGE_SHARED_PROJECTS_VOLUME:-${COMPOSE_PROJECT_NAME:-docker}_sketchforge-shared-projects}}"
  educad-challenges:
