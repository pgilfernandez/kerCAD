name: Package desktop applications

# Packaging is opt-in until each target has been exercised on real devices.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.os }} ${{ matrix.arch }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, arch: arm64, runner: macos-26, variant: current }
          - { os: macOS, arch: x64, runner: macos-15-intel, variant: legacy }
          - { os: windows, arch: x64, runner: windows-latest, variant: current }
          - { os: linux, arch: x64, runner: ubuntu-24.04, variant: current }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, variant: current }
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      KERCAD_COMMIT: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      KERCAD_DESKTOP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Install desktop tools
        run: npm ci --prefix apps/desktop
      - name: Package for the native architecture
        run: npm --prefix apps/desktop run package -- --${{ matrix.arch }}
      - name: Set short artifact revision
        id: revision
        if: always()
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + process.env.GITHUB_SHA.slice(0, 7) + '\n')"

      - name: Upload application installers
        uses: actions/upload-artifact@v4
        with:
          name: kercad-desktop-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.variant }}-${{ steps.revision.outputs.sha }}
          path: |
            dist/desktop/${{ matrix.variant }}/*.dmg
            dist/desktop/${{ matrix.variant }}/*.exe
            dist/desktop/${{ matrix.variant }}/*.AppImage
            dist/desktop/${{ matrix.variant }}/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
