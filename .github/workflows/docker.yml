name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for target-architecture dependencies
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            KERCAD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sketchforge-docker
          cache-to: type=gha,mode=max,scope=sketchforge-docker

  archive:
    name: Docker archive (${{ matrix.architecture }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export compressed Docker image
        env:
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull --platform "linux/$ARCH" "$IMAGE"
          docker tag "$IMAGE" kercad:local
          docker save kercad:local | gzip -1 > dist/kerCAD.tar.gz
          cd dist
          sha256sum kerCAD.tar.gz > kerCAD.tar.gz.sha256

      - name: Set short artifact revision
        id: revision
        if: always()
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + process.env.GITHUB_SHA.slice(0, 7) + '\n')"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: kercad-docker-linux-${{ matrix.architecture }}-${{ steps.revision.outputs.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
