name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Parametric interaction performance budgets
        run: npm run perf:parametric

      - name: Install browser smoke-test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser and device smoke matrix
        run: npm run test:browser

  production:
    name: Production server artifact (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      KERCAD_DOCKER_BUILD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone production server
        run: npm run build

      - name: Assemble server and browser assets
        run: |
          mkdir -p dist/kercad-server/apps/web/.next
          cp -a apps/web/.next/standalone/. dist/kercad-server/
          cp -a apps/web/.next/static dist/kercad-server/apps/web/.next/static
          cp -a apps/web/public dist/kercad-server/apps/web/public
          mkdir -p dist/kercad-server/apps/web/challenges
          if [ -d apps/web/challenges ]; then
            cp -a apps/web/challenges/. dist/kercad-server/apps/web/challenges/
          fi
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/kercad-server/build-info.json', JSON.stringify({
            application: 'kerCAD',
            commit: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            run: process.env.GITHUB_RUN_ID,
            node: process.version,
            platform: process.platform,
            architecture: process.arch,
          }, null, 2) + '\n');
          NODE

      - name: Check packaged server starts outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/kercad-production"
          cp -a dist/kercad-server/. "$RUNNER_TEMP/kercad-production/"
          cd "$RUNNER_TEMP/kercad-production"
          HOSTNAME=127.0.0.1 PORT=3100 node apps/web/server.js > "$RUNNER_TEMP/kercad-production.log" 2>&1 &
          kercad_server_pid=$!
          trap 'kill "$kercad_server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          let ready = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:3100/api/health', { signal: AbortSignal.timeout(2000) });
              const status = await response.json();
              if (response.ok && status.application === 'kerCAD' && status.status === 'ok') { ready = true; break; }
            } catch {}
            await setTimeout(1000);
          }
          if (!ready) throw new Error('Packaged kerCAD server did not become ready.');
          const page = await fetch('http://127.0.0.1:3100/', { signal: AbortSignal.timeout(10000) });
          if (!page.ok) throw new Error(`Homepage returned ${page.status}`);
          NODE

      - name: Archive production artifact
        run: |
          tar -czf dist/kercad-server-linux-x64.tar.gz -C dist kercad-server
          cd dist
          sha256sum kercad-server-linux-x64.tar.gz > kercad-server-linux-x64.tar.gz.sha256

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: kercad-server-linux-x64-${{ github.sha }}
          path: |
            dist/kercad-server-linux-x64.tar.gz
            dist/kercad-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload server startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kercad-production-log-${{ github.sha }}
          path: ${{ runner.temp }}/kercad-production.log
          if-no-files-found: ignore
          retention-days: 7
