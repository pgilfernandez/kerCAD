name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Parametric interaction performance budgets
        run: npm run perf:parametric

      - name: Install browser smoke-test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser and device smoke matrix
        run: npm run test:browser
